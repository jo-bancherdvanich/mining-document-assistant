<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mining Document Assistant</title>
    <meta name="description" content="A simulated prototype of a document assistant for mining engineering reports." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <p class="app-name">Mining Document Assistant</p>
      <p class="prototype-label">Prototype: simulated answers</p>
    </header>

    <main id="conversation" class="conversation">
      <div id="thread" class="thread" role="log" aria-live="polite">
        <section id="welcome" class="welcome">
          <h1>Ask the engineering library</h1>
          <p>Ask a question in plain language to find answers across <span id="file-count"></span> sample mining engineering files.</p>
        </section>
      </div>
    </main>

    <footer class="composer">
      <form id="search-form" class="composer-form" role="search">
        <label for="question" class="visually-hidden">Your question</label>
        <input id="question" type="text" autocomplete="off" placeholder="Ask a question about your files..." />
        <button type="submit">Ask</button>
      </form>
    </footer>

    <dialog id="document-viewer" class="viewer" aria-labelledby="viewer-title">
      <header class="viewer-header">
        <p class="viewer-label">Sample document: made-up content</p>
        <button type="button" id="viewer-close" class="viewer-close">Close</button>
      </header>
      <div id="viewer-body" class="viewer-body"></div>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
